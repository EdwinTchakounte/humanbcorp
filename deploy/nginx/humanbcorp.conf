# ---------------------------------------------------------------------------
# Bloc à AJOUTER dans la config du nginx central MUTUALISÉ :
#   /home/deploy/afrikamode/backend/deploy/nginx/default.conf
# puis recharger :
#   docker exec backend-nginx-1 nginx -t && docker exec backend-nginx-1 nginx -s reload
#
# Prérequis avant d'activer le bloc HTTPS : le certificat doit exister
# (voir la commande certbot dans DEPLOYMENT / le README de déploiement).
# ---------------------------------------------------------------------------

# --- HTTP : challenge ACME (certbot) + redirection vers HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name humanbcorp.com www.humanbcorp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name humanbcorp.com www.humanbcorp.com;

    ssl_certificate     /etc/letsencrypt/live/humanbcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanbcorp.com/privkey.pem;

    client_max_body_size 25M;

    # Médias uploadés : servis directement depuis le volume monté dans le nginx central
    # (voir l'ajout de volume à faire dans le compose du projet "backend").
    location /media/ {
        alias /app/mediafiles-humanbcorp/;
        access_log off;
        expires 30d;
    }

    # Tout le reste — y compris /static/ (servi par WhiteNoise dans gunicorn) — vers l'app
    location / {
        proxy_pass http://humanbcorp_web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
