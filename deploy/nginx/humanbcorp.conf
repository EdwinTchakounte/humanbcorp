# ---------------------------------------------------------------------------
# Vhosts à greffer dans le nginx central MUTUALISÉ (conteneur backend-nginx-1) :
#   /home/deploy/afrikamode/backend/deploy/nginx/default.conf
# puis :  docker exec backend-nginx-1 nginx -t && docker exec backend-nginx-1 nginx -s reload
#
# ÉVOLUTION du monolithe -> découplé. On remplace l'unique site humanbcorp.com
# (qui pointait vers `humanbcorp_web:8000`) par 3 vhosts :
#   humanbcorp.com / www      -> humanbcorp_vitrine:3000   (Next.js)
#   api.humanbcorp.com        -> humanbcorp_api:8000       (Django/gunicorn)
#   dashboard.humanbcorp.com  -> humanbcorp_dashboard:3000 (Next.js)
#
# ⚠️ Les 4 autres sites déjà dans default.conf (afrikamode, api-assistant-ia,
#    edlearning, gathe-finance) NE DOIVENT PAS être touchés. Backup + `nginx -t`
#    avant chaque reload. Voir deploy/RUNBOOK.md pour l'ordre (80 -> certs -> 443).
#
# Certificats :
#   - humanbcorp.com + www  : DÉJÀ émis pour l'ancien monolithe -> réutilisés tels quels.
#   - api. et dashboard.    : À ÉMETTRE (certbot, voir RUNBOOK §4).
# ---------------------------------------------------------------------------


# ======================================================================
# 1) VITRINE — humanbcorp.com + www.humanbcorp.com  -> Next.js
# ======================================================================
server {
    listen 80;
    listen [::]:80;
    server_name humanbcorp.com www.humanbcorp.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name humanbcorp.com www.humanbcorp.com;

    ssl_certificate     /etc/letsencrypt/live/humanbcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanbcorp.com/privkey.pem;

    client_max_body_size 25M;

    # Next.js standalone : SSR + assets /_next/* servis par le serveur node.
    location / {
        proxy_pass http://humanbcorp_vitrine:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_redirect off;
    }
}


# ======================================================================
# 2) API — api.humanbcorp.com  -> Django / gunicorn (ex-humanbcorp_web)
# ======================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.humanbcorp.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.humanbcorp.com;

    ssl_certificate     /etc/letsencrypt/live/api.humanbcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.humanbcorp.com/privkey.pem;

    client_max_body_size 25M;

    # Médias uploadés (images formations, CV...) : servis DIRECTEMENT depuis le
    # volume humanbcorp_media_volume monté dans le nginx central en
    # /app/mediafiles-humanbcorp/ (voir RUNBOOK §6). 404 tant que non monté.
    location /media/ {
        alias /app/mediafiles-humanbcorp/;
        access_log off;
        expires 30d;
    }

    # Tout le reste -> Django. /static/ est servi par WhiteNoise dans gunicorn.
    location / {
        proxy_pass http://humanbcorp_api:8000;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_redirect off;
    }
}


# ======================================================================
# 3) DASHBOARD — dashboard.humanbcorp.com  -> Next.js back-office
# ======================================================================
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.humanbcorp.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.humanbcorp.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.humanbcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.humanbcorp.com/privkey.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://humanbcorp_dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_redirect off;
    }
}
