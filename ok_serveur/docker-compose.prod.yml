services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service nommé `humanbcorp_web` (et non `web`) : unicité d'alias sur backend_default
  # (afrikamode expose déjà un `web`). Le nginx central le joint par ce nom.
  humanbcorp_web:
    image: ${WEB_IMAGE}
    container_name: humanbcorp_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - media_volume:/app/mediafiles
    networks:
      - internal
      - proxy
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

networks:
  internal:
  proxy:
    external: true
    name: backend_default

volumes:
  pgdata:
  media_volume:
