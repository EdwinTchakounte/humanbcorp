# ---------------------------------------------------------------------------
# Bloc à AJOUTER dans la config du nginx central mutualisé (phases 6-7) :
#   /home/deploy/afrikamode/backend/deploy/nginx/default.conf
#
# Procédure :
#   1. Coller d'abord UNIQUEMENT le server{} port 80 ci-dessous, puis :
#        docker exec backend-nginx-1 nginx -t && docker exec backend-nginx-1 nginx -s reload
#   2. Émettre le certificat :
#        docker exec backend-certbot-1 certbot certonly --webroot -w /var/www/certbot \
#          -d humanbcorp.com -d www.humanbcorp.com
#   3. Coller ensuite le server{} port 443, re-tester et recharger nginx.
# ---------------------------------------------------------------------------

# --- HTTP : challenge ACME (certbot) + redirection vers HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name humanbcorp.com www.humanbcorp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name humanbcorp.com www.humanbcorp.com;

    ssl_certificate     /etc/letsencrypt/live/humanbcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanbcorp.com/privkey.pem;

    client_max_body_size 25M;

    # Médias uploadés : servis depuis le volume monté dans le nginx central (phase 8)
    location /media/ {
        alias /app/mediafiles-humanbcorp/;
        access_log off;
        expires 30d;
    }

    # Tout le reste — y compris /static/ (WhiteNoise dans gunicorn) — vers l'app
    location / {
        proxy_pass http://humanbcorp_web:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
