name: Build & Push to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Build découplé : 3 images (backend API + vitrine + dashboard) poussées sous
  #   ghcr.io/<owner>/<repo>/{backend,vitrine,dashboard}
  # (même convention que gathe-finance : .../<projet>/<composant>).
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - component: vitrine
            context: ./web
            dockerfile: ./web/Dockerfile
            # NEXT_PUBLIC_* figées AU BUILD → passées ici avec les URLs de prod.
            # Surchargeable via les "Variables" du dépôt (Settings → Variables).
            build_args: |
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://humanbcorp.com' }}
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.humanbcorp.com' }}
              NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://dashboard.humanbcorp.com' }}
              NEXT_PUBLIC_REVALIDATE=${{ vars.NEXT_PUBLIC_REVALIDATE || '60' }}
          - component: dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.humanbcorp.com' }}
              NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://humanbcorp.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Force lowercase — GHCR exige des noms d'image en minuscules.
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Déploiement continu : SSH sur le serveur, pull des 3 images et up du stack.
  # Activer via la variable de dépôt DEPLOY_ENABLED=true et les secrets :
  #   SSH_HOST, SSH_USER, SSH_KEY (clé privée), SSH_PORT (optionnel).
  # Le serveur doit contenir DEPLOY_PATH avec .env + docker-compose.prod.yml.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '~/humanbcorp' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
