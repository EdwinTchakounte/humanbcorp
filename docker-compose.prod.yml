# ---------------------------------------------------------------------------
# Stack de PRODUCTION — branché sur le reverse-proxy nginx MUTUALISÉ du VPS.
#
# Le nginx central (projet Docker "backend", conteneur backend-nginx-1) détient
# les ports 80/443, termine le TLS et route humanbcorp.com vers le conteneur
# `humanbcorp_web` via le réseau externe `backend_default`.
#
# => Ce stack n'embarque DONC PAS de nginx et n'expose AUCUN port sur l'hôte.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f humanbcorp_web
# ---------------------------------------------------------------------------

services:
  # Service nommé `humanbcorp_db` (et non `db`) : le web est aussi sur
  # `backend_default` où d'autres stacks exposent déjà un `db` — nom unique
  # obligatoire pour que l'app résolve la BONNE base.
  humanbcorp_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal            # réseau privé : jamais exposé au proxy central
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NB: le service est nommé `humanbcorp_web` (et non `web`) pour éviter toute
  # collision d'alias avec les autres applis déjà présentes sur `backend_default`
  # (afrikamode expose déjà un service `web`). Le nginx central le joint par ce nom.
  humanbcorp_web:
    image: ${WEB_IMAGE}
    container_name: humanbcorp_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: humanbcorp_db
      POSTGRES_PORT: 5432
    volumes:
      - media_volume:/app/mediafiles   # médias uploadés, servis par le nginx central
    networks:
      - internal
      - proxy
    depends_on:
      humanbcorp_db:
        condition: service_healthy
    expose:
      - "8000"

  # Ordonnanceur django-q2 : réconciliation des paiements EN_ATTENTE (10 min) et
  # alerte des paiements bloqués (horaire). Indispensable — sans lui, un webhook
  # Tara perdu laisse un paiement bloqué indéfiniment. Bypass de l'entrypoint
  # (migrations gérées par humanbcorp_web) ; ne fait qu'exécuter le cluster.
  humanbcorp_qcluster:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: humanbcorp_db
      POSTGRES_PORT: 5432
    entrypoint: ["python", "manage.py", "qcluster"]
    networks:
      - internal
    depends_on:
      humanbcorp_db:
        condition: service_healthy

networks:
  internal:
  proxy:
    external: true
    name: backend_default      # réseau partagé du nginx central

volumes:
  pgdata:
  media_volume:
